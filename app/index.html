<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GG!</title>
  <meta name="description" content="Keep score with your friends: every game, every high score, who holds it and when.">
  <meta name="theme-color" content="#15100e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GG!">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/darkroom-tokens.css">
  <link rel="stylesheet" href="css/darkroom.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="dr-grain">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gg-gloss" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.44" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.16"/>
    </linearGradient>
  </defs></svg>
  <header class="gg-top" id="top"></header>
  <main class="dr-page gg-page" id="app" aria-live="polite"></main>
  <div id="toast" class="gg-toast" hidden></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Register the offline worker; when a newer one takes over, reopen once so the new files are in use.
    if ('serviceWorker' in navigator) {
      let hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadWorker) window.dispatchEvent(new Event('gg-new-worker')); hadWorker = true; });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
    }
  </script>
</body>
</html>
